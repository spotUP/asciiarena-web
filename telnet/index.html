<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

    <title>My fTelnet</title>

    <link href="/telnet/css/bootstrap.Cyborg.min.css" rel="stylesheet"/>
    <link href="/telnet/css/site.css" rel="stylesheet"/>
</head>
<body>
    <!-- Begin page content -->
    <div class="container">
        <div class="row">
            <div class="col-sm-7">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        My Address Book
                        <div class="pull-right"><a id="hlAddEntry" class="btn btn-xs btn-success"><span class="glyphicon glyphicon-plus"></span> Add a new entry</a></div>
                    </div>
                    <div class="panel-body">
                        <table id="tblMyServers" class="table table-striped table-bordered table-hover" style="margin-bottom: 0;">
                            <tbody>
                                <!-- Bound in js/addressbook.js -->
                            </tbody>
                        </table>
                    </div>
                    <div class="panel-footer">
                        <a id="hlExportEntries" class="btn btn-xs btn-primary"><span class="glyphicon glyphicon-export"></span> Export entries</a>
                        &nbsp;
                        <a id="hlImportEntries" class="btn btn-xs btn-primary"><span class="glyphicon glyphicon-import"></span> Import entries</a>
                        <input type="file" id="fuImport" style="display: none;" />
                    </div>
                </div>
            </div>
            
            <div class="col-sm-7" >
                <div class="panel panel-default">
                    <div class="panel-heading">
                        Telnet
                    </div>
                    <div class="panel-body" style="image-rendering: optimizeSpeed; image-rendering: -moz-crisp-edges; image-rendering: -o-crisp-edges; image-rendering: -webkit-optimize-contrast; image-rendering: pixelated; image-rendering: optimize-contrast; -ms-interpolation-mode: nearest-neighbor;">
                    <div id="fTelnetContainer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="AddEdit" tabindex="-1" role="dialog" aria-labelledby="AddEditLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="AddEditLabel">Add/Edit an address book entry</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group col-xs-12" id="pnlDescription">
                        <label for="txtDescription" class="control-label">Description</label>
                        <input type="text" placeholder="Description" id="txtDescription" class="form-control">
                    </div>
                    <div class="form-group col-sm-6" id="pnlHostname">
                        <label for="txtHostname" class="control-label">Hostname</label>
                        <input type="text" placeholder="Hostname or IP address" id="txtHostname" class="form-control">
                    </div>
                    <div class="form-group col-sm-6" id="pnlPort">
                        <label for="txtPort" class="control-label">Port</label>
                        <input type="text" placeholder="Port" id="txtPort" class="form-control">
                    </div>
                    <div class="form-group col-sm-6">
                        <label for="cboConnectionType" class="control-label">Connection Type</label>
                        <select id="cboConnectionType" class="form-control">
                            <option value="telnet">Telnet</option>
                        </select>
                    </div>
                    <div class="form-group col-sm-6">
                        <label for="cboEmulation" class="control-label">Emulation</label>
                        <select id="cboEmulation" class="form-control">
                            <option selected="selected" value="ansi-bbs">ansi-bbs</option>
                            <option value="c64">Commodore 64</option>
                            <!--<option value="RIP">RIP</option>-->
                        </select>
                    </div>
                    <div class="checkbox col-xs-12" style="margin-top: 0; margin-bottom: 25px;">
                        <label>
                            <input type="checkbox" id="chkProxy" checked="checked"> Connect via proxy?  (See the Settings page for more info)
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <a id="hlSaveEntry" class="btn btn-success pull-left"><span class="glyphicon glyphicon-floppy-saved"></span> Save</a>
                    <button type="button" class="btn btn-danger" data-dismiss="modal"><span class="glyphicon glyphicon-floppy-remove"></span> Cancel</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="/telnet/js/jquery-1.11.2.min.js"><\/script>')</script>
    <script src="//netdna.bootstrapcdn.com/bootstrap/3.3.2/js/bootstrap.min.js"></script>
    <script>$.fn.modal || document.write('<script src="/telnet/js/bootstrap.min.js"><\/script>')</script>

    <script src="/telnet/js/localstorage.js"></script>
    <script src="/telnet/js/addressbook.js"></script>
    <script id="fTelnetScript" src="/telnet/ftelnet.norip.xfer.min.js"></script>

    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

      ga('create', 'UA-4602017-8', 'auto');
      ga('send', 'pageview');
    </script>
    <script>
        goTelnet('',0);
        
        function goTelnet(h,p,c,e,k) {
        $("#fTelnetContainer").html('');
        $(".fTelnetMenuButtons").remove();
        var Options = new fTelnetOptions();
        Options.ProxyHostname = "proxy-us-ca.ftelnet.ca";
        Options.ProxyPort = 1123;
        Options.ProxyPortSecure = 11235;
        Options.ConnectionType = c;
        Options.VirtualKeyboardVisible = (k=='on')
        Options.Emulation = 'ansi-bbs';
        Options.Hostname = h;
        Options.Port = p;
        Options.Font = "Amiga-Topaz";
        Options.ScreenColumns=80;
        Options.ScreenRows=25;
        if (e=='c64') {
         Options.Font = "C64-Lower";
         Options.ScreenColumns=40;
        }
        var Client = new fTelnetClient('fTelnetContainer', Options);
        if (e=='c64') {
         Client._Crt._C64 = true;
        }
        if (h!="") Client.Connect();
      }
    </script>
</body>
</html>
