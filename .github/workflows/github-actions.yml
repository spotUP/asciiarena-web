name: Asciiarena

on:
  push:
    branches:
      - modernize/typescript-nextjs
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build
        # Build on the CI runner — never on the live server.
        # DATABASE_URL is unused during the build: the prisma schema uses
        # @prisma/adapter-mariadb at runtime and has no datasource url field.
        # NEXTAUTH vars are only needed at runtime; placeholders satisfy
        # any compile-time references.
        run: npm ci && npm run build
        env:
          DATABASE_URL: "mysql://build:build@localhost/build"
          NEXTAUTH_URL: "https://asciiarena.se"
          NEXTAUTH_SECRET: "build-placeholder"

      - name: Deploy built artifact to server
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no"
          RSYNC="rsync -az --delete -e '$SSH'"
          SERVER="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          DEST="/var/www/asciiarena.se/nextjs-current"

          # Sync the standalone build output (server.js + .next/server/ + node_modules/)
          # --exclude .env so the server's production secrets are never touched.
          # Note: standalone intentionally omits .next/static/ — synced separately below.
          rsync -az --delete \
            --exclude='.env' \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            .next/standalone/ "$SERVER:$DEST/"

          # Sync .next/static/ (JS chunks, CSS) — NOT included in standalone output.
          #
          # ADDITIVE — never --delete here. Every build mints new
          # content-hashed chunk filenames. A browser that loaded a page before
          # the deploy still holds the OLD names, and code-split chunks
          # (next/dynamic, route segments) are fetched lazily, often minutes
          # later when the user finally clicks something. Deleting the previous
          # build's chunks is what produced "Failed to load chunk ... from
          # module" on every single deploy. Keeping both builds costs ~2 MB per
          # deploy and lets an open tab survive one.
          rsync -az \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            .next/static/ "$SERVER:$DEST/.next/static/"

          # Prune chunks no build has produced in 14 days. Safe because CI
          # always builds from a clean checkout, so every file in the current
          # build carries a fresh mtime that rsync -a copies across; an old
          # mtime therefore means "no recent build referenced this".
          $SSH "$SERVER" "find $DEST/.next/static -type f -mtime +14 -delete 2>/dev/null; \
            find $DEST/.next/static -type d -empty -delete 2>/dev/null; true"

          # Sync public/ (static assets served by Next.js and nginx)
          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            public/ "$SERVER:$DEST/public/"

          # Sync the nginx config (kept in the repo for version control)
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            deploy/asciiarena.se-nginx.conf \
            "$SERVER:/tmp/asciiarena-nginx.conf"

          # Restart the service and reload nginx if config changed
          $SSH "$SERVER" /home/${{ secrets.SSH_USER }}/bin/deploy_asciiarena.sh

          rm -f /tmp/deploy_key
