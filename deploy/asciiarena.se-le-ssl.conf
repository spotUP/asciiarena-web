<IfModule mod_ssl.c>
<VirtualHost *:443>
  Protocols h2 http/1.1
  H2OutputBuffering off
  ProxyTimeout 300
  ServerAdmin spotup@gmail.com
  ServerName  asciiarena.se
  ServerAlias www.asciiarena.se

  LogLevel warn
  ErrorLog  /var/log/apache2/error-asciiarena.se.log
  CustomLog /var/log/apache2/access-asciiarena.se.log combined

  # Large static file directories served directly from filesystem
  AliasMatch "^/mags/(.+)$" /var/www/asciiarena.se/mags/$1
  AliasMatch "^/apps/(.+)$" /var/www/asciiarena.se/apps/$1
  AliasMatch "^/collections/(.+)$" /var/www/asciiarena.se/collections/$1

  <Directory /var/www/asciiarena.se/mags>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>
  <Directory /var/www/asciiarena.se/apps>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>
  <Directory /var/www/asciiarena.se/collections>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  # Everything else (including /assets, /fonts, /_next) -> Next.js on 3001
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPassMatch "^/mags/.+" !
  ProxyPassMatch "^/apps/.+" !
  ProxyPassMatch "^/collections/.+" !
  Header always set X-Accel-Buffering "no"
  # connectiontimeout=5 -> fail fast if next-server isn't listening
  # timeout=60         -> 60s ceiling per proxied request
  # retry=0            -> don't park a failed backend for 60s
  # (Removed disablereuse=on: it was adding ~470ms TTFB per request by
  #  forcing a fresh TCP handshake every time. The original justification
  #  — stale pool entries from a previous deploy wedging requests — is no
  #  longer relevant now that lib/live.ts SIGTERM-closes SSE controllers
  #  and the systemd unit uses KillMode=mixed + TimeoutStopSec=10, so
  #  restarts complete in ~2s and the proxy pool never holds half-dead
  #  connections long enough to matter.)
  ProxyPass        / http://127.0.0.1:3001/ flushpackets=on connectiontimeout=5 timeout=60 retry=0
  ProxyPassReverse / http://127.0.0.1:3001/

  RewriteEngine on
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteCond %{HTTP:Connection} upgrade [NC]
  RewriteRule ^/(.*) ws://127.0.0.1:3001/$1 [P,L]

  Header always set Access-Control-Allow-Origin "*"
  Header always set Cross-Origin-Resource-Policy "cross-origin"
  Header always set Cross-Origin-Embedder-Policy "require-corp"

  SSLCertificateFile    /etc/letsencrypt/live/asciiarena.se/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/asciiarena.se/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
<VirtualHost *:80>
  ServerAdmin spotup@gmail.com
  ServerName  asciiarena.se
  ServerAlias www.asciiarena.se
  RewriteEngine on
  RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
