# event MPM
# Bumped from defaults (150 workers / 64 thread limit) because long-lived
# SSE streams under /api/live tie up one worker per connection — even
# under event MPM, once the response body is flowing Apache cannot async-
# park it. With ~5 SSE channels per active visitor (LiveRefresh widgets +
# chat + polls hero), the original 150 saturated at ~30 concurrent users
# and regular page requests started queueing past their 10s client timeout.
<IfModule mpm_event_module>
	StartServers			  4
	MinSpareThreads		    50
	MaxSpareThreads		   150
	ThreadLimit			  128
	ThreadsPerChild		   64
	MaxRequestWorkers	  1024
	MaxConnectionsPerChild   0
</IfModule>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
