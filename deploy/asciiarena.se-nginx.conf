# Map handles both WebSocket upgrades and SSE (long-lived HTTP) correctly:
# - Upgrade request  -> Connection: upgrade  (WebSocket handshake)
# - Normal/SSE request -> Connection: ''     (clears header, keeps upstream alive)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    server_name asciiarena.se www.asciiarena.se;

    # http2 is REQUIRED: the site holds 7 concurrent SSE channels per tab.
    # On HTTP/1.1 browsers cap at 6 connections per host, so the SSE streams
    # exhaust the pool and every other request (widgets, RSC navigation)
    # queues forever -- links appear dead, widgets never load.
    listen 443 ssl http2;
    # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/asciiarena/fullchain.pem;
    # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/asciiarena/privkey.pem;
    # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Access-Control-Allow-Origin *;
    add_header Cross-Origin-Resource-Policy cross-origin;
    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header X-Accel-Buffering no;

    # Client chunks served directly from disk, NOT proxied to Next.js.
    #
    # Next standalone resolves /_next/static against a file set computed at
    # process STARTUP. deploy.sh rsyncs the new .next and only restarts the
    # service at the very end, so for the whole gap (measured: 70s on
    # 2026-07-28) the live process renders HTML referencing the new chunk
    # names while 404-ing the very files it just asked the browser to fetch:
    #
    #   11:34:13  rsync writes .next/static/chunks/04_f88pua7nms.js
    #   11:35:22  GET /_next/static/chunks/04_f88pua7nms.js -> 404
    #   11:35:23  systemctl restart asciiarena-next
    #
    # The browser surfaces that as "Failed to load chunk <x> from module <y>"
    # and the page stays dead until a hard reload. Proven by writing a file
    # into .next/static/chunks after startup: on disk, readable, still 404.
    #
    # Serving from the filesystem decouples chunk availability from the app
    # process entirely -- files are live the moment rsync writes them, and
    # they keep being served straight through the restart (which otherwise
    # 502s them for the same reason). Chunk filenames are content-addressed
    # (verified: two builds, 0 same-name/different-body), so `immutable` is
    # honest here.
    location /_next/static/ {
        alias /var/www/asciiarena.se/nextjs-current/.next/static/;

        # A location with its own add_header DROPS every server-level
        # add_header, so the two that subresources actually need under
        # COEP: require-corp are repeated here.
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Resource-Policy cross-origin;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # nginx.conf has `gzip on` but leaves gzip_types commented out, so the
        # default is text/html only. Without this, moving chunks off the Next
        # proxy would ship them uncompressed (87KB instead of 28KB).
        gzip_types application/javascript text/javascript text/css application/json;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_min_length 1024;
    }

    # Static asset directories served directly from filesystem (bypasses Next.js)
    # /assets/ and /fonts/ live inside the Next.js project root (tracked in git)
    location /assets/ {
        root /var/www/asciiarena.se/nextjs-current;
        try_files $uri =404;
    }
    location /fonts/ {
        root /var/www/asciiarena.se/nextjs-current;
        try_files $uri =404;
    }
    # /collections/, /apps/, /mags/ are large binary dirs outside the git repo
    location /collections/ {
        root /var/www/asciiarena.se;
        try_files $uri =404;
    }
    location /apps/ {
        root /var/www/asciiarena.se;
        try_files $uri =404;
    }
    location /mags/ {
        root /var/www/asciiarena.se;
        try_files $uri =404;
    }

    # Everything else -> Next.js on port 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Disable buffering for SSE (Server-Sent Events / realtime channels)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        proxy_connect_timeout 10;
    }
}

server {
    listen 80;
    server_name asciiarena.se www.asciiarena.se;
    return 301 https://$host$request_uri;
}
