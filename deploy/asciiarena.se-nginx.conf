server {
    server_name asciiarena.se www.asciiarena.se;

    listen 443 ssl;
    # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/asciiarena.se/fullchain.pem;
    # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/asciiarena.se/privkey.pem;
    # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Access-Control-Allow-Origin *;
    add_header Cross-Origin-Resource-Policy cross-origin;
    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header X-Accel-Buffering no;

    # Large binary collections served directly from filesystem (bypasses Next.js)
    location /collections/ {
        root /var/www/asciiarena.se;
        try_files $uri =404;
    }
    location /apps/ {
        root /var/www/asciiarena.se;
        try_files $uri =404;
    }
    location /mags/ {
        root /var/www/asciiarena.se;
        try_files $uri =404;
    }

    # Everything else -> Next.js on port 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Disable buffering for SSE (Server-Sent Events / realtime channels)
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_connect_timeout 10;
    }
}

server {
    listen 80;
    server_name asciiarena.se www.asciiarena.se;
    return 301 https://$host$request_uri;
}
