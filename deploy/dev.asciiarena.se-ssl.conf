<IfModule mod_ssl.c>
<VirtualHost *:443>
  Protocols h2 http/1.1
  H2OutputBuffering off
  ProxyTimeout 300
  ServerName dev.asciiarena.se

  LogLevel warn
  ErrorLog  /var/log/apache2/error-dev.asciiarena.se.log
  CustomLog /var/log/apache2/access-dev.asciiarena.se.log combined

  # Large binary file directories served directly from filesystem
  Alias /collections /var/www/asciiarena.se/collections
  AliasMatch "^/mags/(.+)$" /var/www/asciiarena.se/mags/$1
  AliasMatch "^/apps/(.+)$" /var/www/asciiarena.se/apps/$1

  <Directory /var/www/asciiarena.se/collections>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>
  <Directory /var/www/asciiarena.se/mags>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>
  <Directory /var/www/asciiarena.se/apps>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  # Everything else (including /assets, /fonts, /_next) -> Next.js on 3003
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass /collections !
  ProxyPassMatch "^/mags/.+" !
  ProxyPassMatch "^/apps/.+" !
  Header always set X-Accel-Buffering "no"
  # connectiontimeout=5 -> if the next-server isn't listening, fail fast
  #   instead of hanging the worker for ProxyTimeout's 300s
  # timeout=60         -> 60s ceiling on a single proxied request body
  # retry=0            -> don't park a failed backend for 60s ("disabled" status)
  # disablereuse=on    -> open a fresh TCP connection per request instead of
  #                       pooling; trades a tiny perf cost for never serving
  #                       a wedged half-dead connection after a deploy
  ProxyPass        / http://127.0.0.1:3003/ flushpackets=on connectiontimeout=5 timeout=60 retry=0 disablereuse=on
  ProxyPassReverse / http://127.0.0.1:3003/

  RewriteEngine on
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteCond %{HTTP:Connection} upgrade [NC]
  RewriteRule ^/(.*) ws://127.0.0.1:3003/$1 [P,L]

  SSLCertificateFile    /etc/letsencrypt/live/dev.asciiarena.se/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/dev.asciiarena.se/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
